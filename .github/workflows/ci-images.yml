name: Build CI Images

on:
  push:
    branches: [develop, main]
    paths:
      - ci/Dockerfile.testenv
      - ci/install-ace.ps1
  workflow_dispatch:   # allow manual rebuild (e.g. when ACE version changes)

permissions:
  contents: read
  packages: write      # push to GHCR

jobs:
  build-testenv:
    name: Build Windows test image
    runs-on: windows-latest   # Windows containers must build on Windows runners
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        # Build context is repo root so COPY ci/install-ace.ps1 resolves correctly.
        # --isolation process: faster than Hyper-V; valid when host OS == container OS.
        run: |
          docker build `
            --isolation process `
            --file ci/Dockerfile.testenv `
            --tag ghcr.io/marcfargas/mdbapi-testenv:latest `
            --tag ghcr.io/marcfargas/mdbapi-testenv:${{ github.sha }} `
            .

      - name: Push image
        run: |
          docker push ghcr.io/marcfargas/mdbapi-testenv:latest
          docker push ghcr.io/marcfargas/mdbapi-testenv:${{ github.sha }}

name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    name: Unit Tests
    # Unit tests run on any OS — no ODBC needed for pure-function tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./... -short -count=1 -race

  build:
    name: Cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build windows/amd64
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" ./...

      - name: Build windows/amd64 (tsnet)
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags tsnet -ldflags="-s -w" ./...

      - name: Build windows/arm64
        run: CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -ldflags="-s -w" ./...

  integration:
    name: Integration Tests (ODBC)
    runs-on: windows-latest
    # Only run on pushes to main/develop to save runner minutes.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Test data lives in a separate repo (no license on the files).
      # We clone it fresh at CI time — never committed to this repo.
      - name: Fetch test data
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/marcfargas/mdbtestdata testdata

      - name: Install Access Database Engine (64-bit)
        shell: pwsh
        run: |
          $url = "https://download.microsoft.com/download/2/4/3/24375141-E08D-4803-AB0E-10F2E3A07AAA/AccessDatabaseEngine_X64.exe"
          Invoke-WebRequest $url -OutFile ace64.exe
          Start-Process ace64.exe -ArgumentList "/quiet" -Wait -NoNewWindow

      - name: Build probe tool
        shell: pwsh
        run: go build -o probe.exe ./cmd/probe

      - name: Run ODBC probe against testdata
        shell: pwsh
        run: .\probe.exe -dir testdata\

      - name: Run integration tests
        run: go test ./... -run Integration -v -tags integration -count=1

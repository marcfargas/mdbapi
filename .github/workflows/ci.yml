name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Job dependency chain:
#
#   test ──┐
#           ├──► integration   (windows-latest, Docker container)
#   build ──┘

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./... -short -count=1 -race

  build:
    name: Cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build windows/amd64
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" ./...

      - name: Build windows/amd64 (tsnet)
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags tsnet -ldflags="-s -w" ./...

      - name: Build windows/arm64
        run: CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -ldflags="-s -w" ./...

  integration:
    name: Integration Tests
    runs-on: windows-latest
    needs: [test, build]
    # Only on push (not PRs) — saves windows-latest runner minutes.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install ACE driver
        # Resolves the download URL dynamically from the Microsoft Download Center
        # page — no hardcoded CDN path (it has already changed once, causing 404).
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -NoProfile -File ci\install-ace.ps1

      - name: Build Windows binaries
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          go build -ldflags="-s -w" -o dist\mdbapi.exe .\cmd\mdbapi
          go build -ldflags="-s -w" -o dist\probe.exe  .\cmd\probe

      - name: Fetch test data
        shell: pwsh
        run: git clone --depth 1 https://github.com/marcfargas/mdbtestdata testdata

      - name: Test -- service installer
        # The windows-latest runner is a fresh VM with SCM available.
        # Install the service, verify SCM registration, uninstall. Clean.
        shell: pwsh
        run: |
          $cfgDir = 'C:\ProgramData\MDBService'
          New-Item -ItemType Directory -Path $cfgDir -Force | Out-Null
          @'
          service:
            name: MDBRestService
            display_name: MDB REST Service
            description: Read-only REST API for Access databases
          auth:
            keys:
              - "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          databases: []
          '@ | Out-File "$cfgDir\config.yaml" -Encoding utf8

          Write-Host "--- install ---"
          & dist\mdbapi.exe install -config "$cfgDir\config.yaml"
          if ($LASTEXITCODE -ne 0) { throw "install failed ($LASTEXITCODE)" }

          Write-Host "--- verify SCM ---"
          $svc = Get-Service -Name MDBRestService -ErrorAction SilentlyContinue
          if (-not $svc) { throw "Service not found in SCM after install" }
          Write-Host "Service registered: $($svc.Status)"

          Write-Host "--- uninstall ---"
          & dist\mdbapi.exe uninstall -config "$cfgDir\config.yaml"
          if ($LASTEXITCODE -ne 0) { throw "uninstall failed ($LASTEXITCODE)" }

          Write-Host "Service installer test PASSED"

      - name: Test -- ODBC probe
        shell: pwsh
        run: |
          & dist\probe.exe -dir testdata
          if ($LASTEXITCODE -ne 0) { throw "ODBC probe failed ($LASTEXITCODE)" }

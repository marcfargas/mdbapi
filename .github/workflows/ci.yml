name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Job dependency chain:
#
#   test ──┐
#           ├──► integration-ace2016 (windows-latest, no Go needed)
#           └──► integration-ace2010 (windows-latest, no Go needed)
#   build ──┘
#     └── uploads windows-amd64 artifact (90-day retention)

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./... -short -count=1 -race

  build:
    name: Cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build windows/amd64
        run: |
          mkdir -p dist/amd64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" \
            -o dist/amd64/mdbapi.exe ./cmd/mdbapi
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" \
            -o dist/amd64/probe.exe  ./cmd/probe
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" \
            -o dist/amd64/integration.exe ./cmd/integration

      - name: Build windows/amd64 (tsnet)
        run: |
          mkdir -p dist/tsnet
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags tsnet -ldflags="-s -w" \
            -o dist/tsnet/mdbapi_tsnet.exe ./cmd/mdbapi

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: dist/amd64/*.exe
          retention-days: 90

      - name: Upload tsnet binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64-tsnet
          path: dist/tsnet/*.exe
          retention-days: 90

  integration-ace2016:
    name: Integration Tests (ACE 2016)
    runs-on: windows-latest
    needs: [test, build]
    # Only on push (not PRs) - saves windows-latest runner minutes.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-amd64
          path: dist

      - name: Install ACE 2016
        shell: pwsh
        run: .\ci\install-ace.ps1 -Version 2016

      - name: Fetch test data
        shell: pwsh
        run: git clone --depth 1 https://github.com/marcfargas/mdbtestdata testdata

      - name: Test -- service installer
        shell: pwsh
        run: |
          $cfgDir = 'C:\ProgramData\MDBService'
          New-Item -ItemType Directory -Path $cfgDir -Force | Out-Null
          Copy-Item ci\test-config.yaml "$cfgDir\config.yaml"

          Write-Host "--- install ---"
          & dist\mdbapi.exe install -config "$cfgDir\config.yaml"
          if ($LASTEXITCODE -ne 0) { throw "install failed ($LASTEXITCODE)" }

          Write-Host "--- verify SCM ---"
          $svc = Get-Service -Name MDBRestService -ErrorAction SilentlyContinue
          if (-not $svc) { throw "Service not found in SCM after install" }
          Write-Host "Service registered: $($svc.Status)"

          Write-Host "--- uninstall ---"
          & dist\mdbapi.exe uninstall -config "$cfgDir\config.yaml"
          if ($LASTEXITCODE -ne 0) { throw "uninstall failed ($LASTEXITCODE)" }

          Write-Host "Service installer test PASSED"

      - name: Test -- ODBC integration (modern files)
        shell: pwsh
        run: |
          & dist\integration.exe -dir testdata\data
          if ($LASTEXITCODE -ne 0) { throw "Integration tests failed" }

  integration-ace2010:
    name: Integration Tests (ACE 2010)
    runs-on: windows-latest
    needs: [test, build]
    # Only on push (not PRs) - saves windows-latest runner minutes.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-amd64
          path: dist

      - name: Install ACE 2010
        shell: pwsh
        run: .\ci\install-ace.ps1 -Version 2010

      - name: Fetch test data
        shell: pwsh
        run: git clone --depth 1 https://github.com/marcfargas/mdbtestdata testdata

      - name: Test -- service installer
        shell: pwsh
        run: |
          $cfgDir = 'C:\ProgramData\MDBService'
          New-Item -ItemType Directory -Path $cfgDir -Force | Out-Null
          Copy-Item ci\test-config.yaml "$cfgDir\config.yaml"

          Write-Host "--- install ---"
          & dist\mdbapi.exe install -config "$cfgDir\config.yaml"
          if ($LASTEXITCODE -ne 0) { throw "install failed ($LASTEXITCODE)" }

          Write-Host "--- verify SCM ---"
          $svc = Get-Service -Name MDBRestService -ErrorAction SilentlyContinue
          if (-not $svc) { throw "Service not found in SCM after install" }
          Write-Host "Service registered: $($svc.Status)"

          Write-Host "--- uninstall ---"
          & dist\mdbapi.exe uninstall -config "$cfgDir\config.yaml"
          if ($LASTEXITCODE -ne 0) { throw "uninstall failed ($LASTEXITCODE)" }

          Write-Host "Service installer test PASSED"

      - name: Test -- ODBC integration (all files including Access 97)
        shell: pwsh
        run: |
          & dist\integration.exe -dir testdata\data -dir testdata\data-legacy
          if ($LASTEXITCODE -ne 0) { throw "Integration tests failed" }

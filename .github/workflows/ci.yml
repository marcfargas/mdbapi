name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Job dependency chain:
#
#   test ──┐
#           ├──► integration   (windows-latest, Docker container)
#   build ──┘

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./... -short -count=1 -race

  build:
    name: Cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build windows/amd64
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" ./...

      - name: Build windows/amd64 (tsnet)
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags tsnet -ldflags="-s -w" ./...

      - name: Build windows/arm64
        run: CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -ldflags="-s -w" ./...

  integration:
    name: Integration Tests
    runs-on: windows-latest
    needs: [test, build]
    # Only on push (not PRs) — saves windows-latest runner minutes.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Windows binaries
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          go build -ldflags="-s -w" -o dist\mdbapi.exe   .\cmd\mdbapi
          go build -ldflags="-s -w" -o dist\probe.exe    .\cmd\probe

      - name: Fetch test data
        shell: pwsh
        run: git clone --depth 1 https://github.com/marcfargas/mdbtestdata testdata

      - name: Pull Windows test image
        # Falls back to building locally if image not yet pushed to GHCR.
        shell: pwsh
        run: |
          docker pull ghcr.io/marcfargas/mdbapi-testenv:latest
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Image not in GHCR — building locally..."
            docker build --isolation process `
              --file ci/Dockerfile.testenv `
              --tag ghcr.io/marcfargas/mdbapi-testenv:latest `
              .
          }

      - name: Test — service installer
        # Mounts dist\ into the container, installs the service in the container's
        # own SCM, verifies registration, then uninstalls. No host SCM is touched.
        shell: pwsh
        run: |
          $cfg = @"
          service:
            name: MDBRestService
            display_name: MDB REST Service
            description: Read-only REST API for Access databases
          auth:
            keys:
              - "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          databases: []
          "@
          # Write config where the container will see it
          New-Item -ItemType Directory -Path dist\config -Force | Out-Null
          $cfg | Out-File -FilePath dist\config\config.yaml -Encoding utf8

          docker run --isolation process --rm `
            --volume "${PWD}\dist:C:\mdbapi" `
            ghcr.io/marcfargas/mdbapi-testenv:latest `
            powershell -Command @"
              Set-StrictMode -Version Latest
              `$ErrorActionPreference = 'Stop'

              Write-Host '--- install ---'
              & C:\mdbapi\mdbapi.exe install -config C:\mdbapi\config\config.yaml
              if (`$LASTEXITCODE -ne 0) { throw 'install failed' }

              Write-Host '--- verify SCM registration ---'
              `$svc = Get-Service -Name MDBRestService -ErrorAction SilentlyContinue
              if (-not `$svc) { throw 'Service not found in SCM after install' }
              Write-Host "Service status: `$(`$svc.Status)"

              Write-Host '--- uninstall ---'
              & C:\mdbapi\mdbapi.exe uninstall -config C:\mdbapi\config\config.yaml
              if (`$LASTEXITCODE -ne 0) { throw 'uninstall failed' }

              Write-Host 'Service installer test PASSED'
          "@

      - name: Test — ODBC probe
        # Mounts dist\ + testdata\ into the container; runs the type-inspection probe.
        shell: pwsh
        run: |
          docker run --isolation process --rm `
            --volume "${PWD}\dist:C:\mdbapi" `
            --volume "${PWD}\testdata:C:\testdata" `
            ghcr.io/marcfargas/mdbapi-testenv:latest `
            powershell -Command "& C:\mdbapi\probe.exe -dir C:\testdata"

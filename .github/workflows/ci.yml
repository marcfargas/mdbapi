name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Job dependency chain:
#
#   test ──┐
#           ├──► integration   (windows-latest, no Go needed)
#   build ──┘
#     └── uploads windows-amd64 artifact (mdbapi.exe + probe.exe + integration.exe)

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./... -short -count=1 -race

  build:
    name: Cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build windows/amd64
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" \
            -o dist/mdbapi.exe ./cmd/mdbapi
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" \
            -o dist/probe.exe  ./cmd/probe
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" \
            -o dist/integration.exe ./cmd/integration

      - name: Build windows/amd64 (tsnet)
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags tsnet -ldflags="-s -w" ./cmd/mdbapi

      - name: Build windows/arm64
        run: CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -ldflags="-s -w" ./cmd/mdbapi

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: dist/*.exe
          retention-days: 1

  integration:
    name: Integration Tests
    runs-on: windows-latest
    needs: [test, build]
    # Only on push (not PRs) — saves windows-latest runner minutes.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4   # needed for ci/install-ace.ps1 and testdata clone

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-amd64
          path: dist

      - name: Install ACE driver (2010, supports Access 97)
        shell: pwsh
        run: .\ci\install-ace.ps1 -Version 2010

      - name: Fetch test data
        shell: pwsh
        run: git clone --depth 1 https://github.com/marcfargas/mdbtestdata testdata

      - name: Test -- service installer
        shell: pwsh
        run: |
          $cfgDir = 'C:\ProgramData\MDBService'
          New-Item -ItemType Directory -Path $cfgDir -Force | Out-Null
          Copy-Item ci\test-config.yaml "$cfgDir\config.yaml"

          Write-Host "--- install ---"
          & dist\mdbapi.exe install -config "$cfgDir\config.yaml"
          if ($LASTEXITCODE -ne 0) { throw "install failed ($LASTEXITCODE)" }

          Write-Host "--- verify SCM ---"
          $svc = Get-Service -Name MDBRestService -ErrorAction SilentlyContinue
          if (-not $svc) { throw "Service not found in SCM after install" }
          Write-Host "Service registered: $($svc.Status)"

          Write-Host "--- uninstall ---"
          & dist\mdbapi.exe uninstall -config "$cfgDir\config.yaml"
          if ($LASTEXITCODE -ne 0) { throw "uninstall failed ($LASTEXITCODE)" }

          Write-Host "Service installer test PASSED"

      - name: Test -- ODBC integration
        shell: pwsh
        run: |
          & dist\integration.exe -dir testdata
          if ($LASTEXITCODE -ne 0) { throw "Integration tests failed" }
